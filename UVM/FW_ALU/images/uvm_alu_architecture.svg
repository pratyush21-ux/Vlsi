<path d="M516 258 L470 258 L470 284 L446 284" class="arr" marker-end="url(#arrow)"/>
<line x1="572" y1="238" x2="572" y2="192" class="arr" marker-end="url(#arrow)"/>
<line x1="558" y1="192" x2="558" y2="238" class="arr" marker-end="url(#arrow)"/>

<line x1="171" y1="310" x2="171" y2="346" class="arr" marker-end="url(#arrow)"/>
<line x1="369" y1="310" x2="369" y2="346" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="572" y="360" text-anchor="middle">config_db</text>
